<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2563eb">
  <title>Conflicts - Charter Schedule Checker</title>
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css?v=2.3">
</head>
<body>
  <div class="mobile-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="header-main">
        <div class="logo-badge">
          <i class="fa-solid fa-calendar-xmark"></i>
        </div>
        <div>
          <h1 class="app-title">Conflicts</h1>
          <p class="app-subtitle">Charter Schedule Checker</p>
        </div>
      </div>
      <button id="btn-refresh" class="btn-icon-pill" aria-label="Refresh Data" title="Refresh Live Database">
        <i class="fa-solid fa-arrows-rotate" id="refresh-icon"></i>
        <span class="refresh-text">Sync</span>
      </button>
    </header>

    <!-- Live Status Banner -->
    <div id="status-bar" class="status-bar connecting">
      <div class="status-dot"></div>
      <span id="status-text" class="status-text">Connecting to Charter DB...</span>
      <span id="event-counts" class="status-counts"></span>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Calendar Card -->
      <div class="card calendar-card">
        <!-- Calendar Header -->
        <div class="calendar-header">
          <button type="button" id="cal-prev" class="cal-nav-btn" aria-label="Previous Month">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <div class="cal-title-wrapper">
            <span id="cal-month-year" class="cal-month-year">September 2026</span>
            <button type="button" id="cal-today-btn" class="cal-today-btn">Today</button>
          </div>
          <button type="button" id="cal-next" class="cal-nav-btn" aria-label="Next Month">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>

        <!-- Calendar Weekdays -->
        <div class="calendar-weekdays">
          <span>Sun</span>
          <span>Mon</span>
          <span>Tue</span>
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>
        </div>

        <!-- Calendar Days Grid -->
        <div id="calendar-days" class="calendar-days">
          <!-- Dynamically populated via JS -->
        </div>

        <!-- Selected Date Indicator Bar -->
        <div id="selected-date-bar" class="selected-date-bar">
          <i class="fa-regular fa-calendar-check"></i>
          <span id="selected-date-text">Events for selected date</span>
        </div>

        <!-- Results Area (Under the Calendar) -->
        <section id="results-area" class="results-area">
          <!-- Result Summary Banner (No Conflicts Found) -->
          <div id="result-banner" class="result-banner hidden">
            <div class="banner-icon-box" id="banner-icon-box">
              <i id="banner-icon" class="fa-solid fa-check"></i>
            </div>
            <div class="banner-details">
              <h2 id="banner-title" class="banner-title">No Conflicts Found</h2>
            </div>
          </div>

          <!-- Conflicting Events Section -->
          <div id="conflicts-section" class="events-group hidden">
            <div class="section-header">
              <h3 class="section-title">
                <i class="fa-solid fa-triangle-exclamation text-danger"></i> Conflicting Events
              </h3>
              <span id="conflict-count-badge" class="count-badge badge-danger">0</span>
            </div>
            <div id="conflicts-list" class="cards-list">
              <!-- Dynamically populated via JS -->
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js?v=2.3"></script>
</body>
</html>
